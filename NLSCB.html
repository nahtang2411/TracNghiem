<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn tập Năng Lực Số - Mac OS UI</title>
    <style>
        :root {
            --mac-bg: #f5f5f7;
            --mac-border: #d1d1d6;
            --mac-titlebar: #e5e5ea;
            --mac-text: #1d1d1f;
            --mac-blue: #007aff;
            --mac-green: #34c759;
            --mac-red: #ff3b30;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .mac-window {
            width: 800px;
            max-width: 95%;
            height: 600px;
            background-color: var(--mac-bg);
            border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .title-bar {
            height: 38px;
            background-color: var(--mac-titlebar);
            border-bottom: 1px solid var(--mac-border);
            display: flex;
            align-items: center;
            padding: 0 16px;
        }

        .traffic-lights {
            display: flex;
            gap: 8px;
        }

        .light {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .close { background-color: #ff5f56; border: 1px solid #e0443e; }
        .minimize { background-color: #ffbd2e; border: 1px solid #dea123; }
        .maximize { background-color: #27c93f; border: 1px solid #1aab29; }

        .window-title {
            flex-grow: 1;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            color: #333;
            margin-right: 60px; /* offset for traffic lights */
        }

        .content {
            padding: 30px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .start-screen, .result-screen {
            text-align: center;
            margin: auto;
        }

        .start-screen h1 {
            font-size: 28px;
            color: var(--mac-text);
            margin-bottom: 10px;
        }

        .start-screen p {
            color: #666;
            margin-bottom: 30px;
        }

        .btn {
            background-color: var(--mac-blue);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .quiz-container {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .progress-bar {
            height: 8px;
            background-color: #e5e5ea;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--mac-blue);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .question-text {
            font-size: 20px;
            font-weight: 600;
            color: var(--mac-text);
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .option-btn {
            background-color: white;
            border: 1px solid var(--mac-border);
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 15px;
            color: var(--mac-text);
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .option-btn:hover {
            background-color: #f8f8f8;
            border-color: #bbb;
        }

        .option-btn.correct {
            background-color: #d4edda;
            border-color: var(--mac-green);
            color: #155724;
        }

        .option-btn.wrong {
            background-color: #f8d7da;
            border-color: var(--mac-red);
            color: #721c24;
        }
        
        .feedback {
            margin-top: 20px;
            font-style: italic;
            font-size: 14px;
            color: #555;
            min-height: 20px;
        }

        .next-btn {
            margin-top: auto;
            align-self: flex-end;
            display: none;
        }
    </style>
</head>
<body>

    <div class="mac-window">
        <div class="title-bar">
            <div class="traffic-lights">
                <div class="light close"></div>
                <div class="light minimize"></div>
                <div class="light maximize"></div>
            </div>
            <div class="window-title">Ôn tập Năng Lực Số.app</div>
        </div>

        <div class="content">
            <!-- Màn hình chào -->
            <div class="start-screen" id="startScreen">
                <h1>Trắc Nghiệm Năng Lực Số Cơ Bản</h1>
                <p>Tổng hợp kiến thức Word, Excel, PowerPoint, Tìm kiếm & Hợp tác số.</p>
                <button class="btn" onclick="startQuiz()">Bắt Đầu Chơi</button>
            </div>

            <!-- Màn hình Câu hỏi -->
            <div class="quiz-container" id="quizContainer">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="question-header">
                    <span id="questionCount">Câu 1/150</span>
                    <span id="scoreDisplay">Điểm: 0</span>
                </div>
                <div class="question-text" id="questionText">Nội dung câu hỏi...</div>
                <div class="options-grid" id="optionsGrid">
                    <!-- Nút lựa chọn sẽ được render tại đây -->
                </div>
                <div class="feedback" id="feedbackText"></div>
                <button class="btn next-btn" id="nextBtn" onclick="nextQuestion()">Câu Tiếp Theo</button>
            </div>

            <!-- Màn hình Kết quả -->
            <div class="result-screen" id="resultScreen" style="display: none;">
                <h1>Hoàn Thành Bài Tập!</h1>
                <p id="finalScoreText" style="font-size: 18px; margin-bottom: 20px;"></p>
                <button class="btn" onclick="location.reload()">Chơi Lại</button>
            </div>
        </div>
    </div>

    <script>

            // EXCEL[span_51](start_span)[span_51](end_span)

            { q: "Team charter (Quy tắc nhóm) nên được lập khi nào?[span_82](start_span)[span_82](end_span)", o: ["Ngay khi mới thành nhóm, trước khi bắt tay vào việc", "Khi nộp bài cuối kỳ", "Khi có thành viên không làm bài", "Khi họp lần cuối"], a: 0 }

        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startQuiz() {
            // Lấy 30 câu ngẫu nhiên hoặc toàn bộ để tạo bài test
            currentQuestions = shuffleArray([...questionBank]).slice(0, 30); 
            currentIndex = 0;
            score = 0;
            
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('quizContainer').style.display = 'flex';
            
            showQuestion();
        }

        function showQuestion() {
            const q = currentQuestions[currentIndex];
            document.getElementById('questionCount').innerText = `Câu ${currentIndex + 1}/${currentQuestions.length}`;
            document.getElementById('scoreDisplay').innerText = `Điểm: ${score}`;
            document.getElementById('questionText').innerText = q.q;
            
            const progress = ((currentIndex) / currentQuestions.length) * 100;
            document.getElementById('progressFill').style.width = `${progress}%`;

            const optionsGrid = document.getElementById('optionsGrid');
            optionsGrid.innerHTML = '';
            document.getElementById('feedbackText').innerText = '';
            document.getElementById('nextBtn').style.display = 'none';

            q.o.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                optionsGrid.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, btnElement) {
            const q = currentQuestions[currentIndex];
            const buttons = document.querySelectorAll('.option-btn');
            
            // Disable all buttons
            buttons.forEach(b => b.style.pointerEvents = 'none');

            if (selectedIndex === q.a) {
                btnElement.classList.add('correct');
                score++;
                document.getElementById('feedbackText').innerText = "Chính xác! Căn cứ theo nội dung Slide bài giảng.";
                document.getElementById('feedbackText').style.color = "var(--mac-green)";
            } else {
                btnElement.classList.add('wrong');
                buttons[q.a].classList.add('correct');
                document.getElementById('feedbackText').innerText = "Sai rồi! Đáp án đúng đã được hiển thị màu xanh.";
                document.getElementById('feedbackText').style.color = "var(--mac-red)";
            }

            document.getElementById('scoreDisplay').innerText = `Điểm: ${score}`;
            document.getElementById('nextBtn').style.display = 'block';
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuestions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('resultScreen').style.display = 'block';
            
            const percentage = Math.round((score / currentQuestions.length) * 100);
            document.getElementById('finalScoreText').innerText = 
                `Bạn đạt ${score}/${currentQuestions.length} câu (${percentage}%)\nKiến thức đã được trích xuất trực tiếp từ các slide Word, Excel, PowerPoint.`;
            
            document.getElementById('progressFill').style.width = `100%`;
        }
    </script>
</body>
</html>
